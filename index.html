<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>One Health Career Toolkit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* Layout: university-style page: thin scarlet stripe, white header with section nav, gray page-title band, white content, dark gray footer */
  :root{
    --scarlet:#BB0000; --scarlet-dark:#970000; --on-scarlet:#FFFFFF;
    --bg:#FFFFFF; --band:#F1F2F2; --fg:#212326; --muted:#5A6064; --border:#D3D7D9; --surface:#FFFFFF;
    --link:#A30000; --track:#E2E5E6; --foot:#2A2D30; --foot-fg:#E6E8E9; --focus:#1A5FB4; --mark:#FFE9A8; --mark-fg:#212326;
    --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --scarlet:#C8262B; --scarlet-dark:#E5484D; --on-scarlet:#FFFFFF;
      --bg:#151719; --band:#1E2123; --fg:#ECEEEF; --muted:#A4ABAF; --border:#34393C; --surface:#1A1D1F;
      --link:#FF8E91; --track:#2B3033; --foot:#0F1112; --foot-fg:#C9CED1; --focus:#7DB2F5; --mark:#5A4A12; --mark-fg:#FFF3CC;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --scarlet:#C8262B; --scarlet-dark:#E5484D; --on-scarlet:#FFFFFF;
    --bg:#151719; --band:#1E2123; --fg:#ECEEEF; --muted:#A4ABAF; --border:#34393C; --surface:#1A1D1F;
    --link:#FF8E91; --track:#2B3033; --foot:#0F1112; --foot-fg:#C9CED1; --focus:#7DB2F5; --mark:#5A4A12; --mark-fg:#FFF3CC;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.55;margin:0}
  h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
  p{margin:0}
  button,input,select,textarea{font-family:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .inner{max-width:1000px;margin:0 auto;padding-inline:16px}

  header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
  .stripe{height:6px;background:var(--scarlet)}
  .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;padding-top:12px}
  .ptitle{display:flex;flex-direction:column;padding-bottom:10px}
  .ptitle .proj{font-family:var(--serif);font-weight:700;font-size:1.35rem;line-height:1.1}
  .ptitle .sub{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px}
  nav.main{display:flex;gap:2px;overflow-x:auto;max-width:100%}
  nav.main button,nav.main a{background:none;border:none;border-bottom:4px solid transparent;padding:10px 12px 8px;font-size:.95rem;font-weight:600;color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
  nav.main [aria-current="page"]{border-bottom-color:var(--scarlet)}
  nav.main button:hover:not([aria-disabled="true"]),nav.main a:hover{border-bottom-color:var(--border)}
  nav.main [aria-current="page"]:hover{border-bottom-color:var(--scarlet)}
  nav.main [aria-disabled="true"]{color:var(--muted);cursor:default;font-weight:400}

  .pagehead{background:var(--band);border-bottom:1px solid var(--border);padding-block:22px 26px}
  .crumbs{font-size:.84rem;color:var(--muted);margin-bottom:8px}
  .crumbs button{background:none;border:none;padding:0;color:var(--link);font-size:inherit;cursor:pointer;text-decoration:underline}
  h1{font-size:clamp(1.8rem,5vw,2.5rem)}
  .lede{color:var(--muted);max-width:62ch;margin-top:10px;font-size:1.05rem}

  .content{padding-block:30px 56px}
  h2{font-size:1.4rem}
  .section{margin-top:34px}
  .section:first-child{margin-top:0}
  .section>h2{margin-bottom:6px;padding-bottom:8px;border-bottom:2px solid var(--scarlet);display:inline-block}
  .hint{color:var(--muted);font-size:.92rem;margin:8px 0 14px}
  .small{font-size:.88rem;color:var(--muted)}

  .btn{background:var(--scarlet);color:var(--on-scarlet);border:none;border-radius:3px;padding:10px 20px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--scarlet-dark)}
  .btn.ghost{background:transparent;color:var(--link);border:2px solid currentColor;padding:8px 18px}
  .btn.ghost:hover{background:var(--band)}
  .btn.sm{padding:6px 12px;font-size:.85rem}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .textbtn{background:none;border:none;color:var(--link);text-decoration:underline;cursor:pointer;font-size:.88rem;padding:4px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .tile{background:var(--surface);border:1px solid var(--border);padding:16px}
  .tile .n{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .tile .l{font-size:.86rem;color:var(--muted);margin-top:4px}
  .panel{background:var(--surface);border:1px solid var(--border);padding:20px}
  .cap{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}

  .barrow{display:grid;grid-template-columns:minmax(150px,1.2fr) 3fr 64px;gap:12px;align-items:center;font-size:.92rem;margin-bottom:10px}
  .barrow>*{min-width:0}
  .track{height:10px;background:var(--track);border-radius:2px;overflow:hidden}
  .fill{height:100%;background:var(--scarlet)}
  .barrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  @media(max-width:560px){.barrow{grid-template-columns:1fr 64px}.barrow .track{grid-column:1 / -1;order:3}}
  .empty{color:var(--muted);font-size:.95rem}

  .tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .tool{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--scarlet);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .tool h3{font-size:1.15rem}
  .tool p{color:var(--muted);font-size:.93rem;flex:1}
  .tool.soon{border-top-color:var(--border)}
  .tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  svg.chart{width:100%;height:auto;display:block}
  .chart .gl{stroke:var(--border);stroke-width:1}
  .chart .tx{fill:var(--muted);font-size:12px;font-family:var(--sans)}
  .chart .tv{fill:var(--fg);font-size:13px;font-weight:700;font-family:var(--sans)}
  .chart .ln{fill:none;stroke:var(--scarlet);stroke-width:3;stroke-linejoin:round}
  .chart .dot{fill:var(--bg);stroke:var(--scarlet);stroke-width:3}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .twocol>*{min-width:0}
  @media(max-width:760px){.twocol{grid-template-columns:1fr}}
  table.t{width:100%;border-collapse:collapse;font-size:.92rem}
  table.t th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border)}
  table.t td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
  .tscroll{overflow-x:auto}
  .banner{background:var(--band);border-left:4px solid var(--scarlet);padding:10px 14px;font-size:.92rem;margin-bottom:20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

  .seg{display:inline-flex;border:2px solid var(--scarlet);border-radius:3px;overflow:hidden;margin-bottom:24px;flex-wrap:wrap}
  .seg button{background:transparent;border:none;padding:10px 18px;font-size:.95rem;font-weight:700;color:var(--link);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--scarlet);color:var(--on-scarlet)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:6px}
  .step{border-left:4px solid var(--scarlet);padding-left:12px}
  .step b{display:block;font-family:var(--serif);font-size:1.02rem}
  .step span{color:var(--muted);font-size:.9rem}
  .notice{background:var(--band);border-left:4px solid var(--muted);padding:10px 14px;font-size:.92rem;margin-top:16px}
  .count{font-size:.9rem;color:var(--muted);margin-top:16px;font-weight:600}

  .domain{margin-top:34px}
  .domain>h2{font-size:1.25rem;border-bottom:2px solid var(--scarlet);padding-bottom:8px;margin-bottom:14px}
  .card{background:var(--surface);border:1px solid var(--border);padding:16px 18px;margin-bottom:12px}
  .card .label{font-weight:700;font-size:1.02rem}
  .card .desc{margin:8px 0 12px}
  .card .desc .cap{margin-bottom:4px}
  .card .desc ul{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem}
  .scale{display:flex;gap:6px;max-width:360px}
  .scale button{flex:1;padding:9px 0;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:.95rem;font-weight:600;cursor:pointer;border-radius:3px}
  .scale button:hover{border-color:var(--muted)}
  .scale button[aria-pressed="true"]{background:var(--scarlet);border-color:var(--scarlet);color:var(--on-scarlet)}
  .scalecap{display:flex;justify-content:space-between;max-width:360px;font-size:.76rem;color:var(--muted);margin-top:4px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .f2>*{min-width:0}
  @media(max-width:600px){.f2{grid-template-columns:1fr}}
  .fl{display:block;font-size:.84rem;font-weight:700;margin-bottom:4px}
  textarea,input[type=text],input[type=url],select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--fg);font-size:.95rem}
  textarea{min-height:62px;resize:vertical}
  textarea.big{min-height:200px}
  select{width:auto}

  /* personalized */
  .formgrid{display:grid;gap:14px}
  .formgrid.two{grid-template-columns:1fr 1fr}
  .formgrid>*{min-width:0}
  @media(max-width:600px){.formgrid.two{grid-template-columns:1fr}}
  .err{color:#B3261E;font-size:.9rem;margin-top:6px}
  :root[data-theme="dark"] .err{color:#FF9A93}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FF9A93}}
  .sheetlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:28px}
  .sheetcard{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--scarlet);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sheetcard h3{font-size:1.05rem;overflow-wrap:anywhere}
  .sheetbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:16px}
  .strip{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.9rem;margin:18px 0 6px;font-weight:600}
  .strip span b{font-variant-numeric:tabular-nums}
  .group{font-family:var(--serif);font-size:1.12rem;font-weight:700;margin:26px 0 12px;display:flex;gap:10px;align-items:baseline}
  .group small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.86rem}
  .card.imp3{border-left:6px solid var(--scarlet)}
  .card.imp2{border-left:6px solid var(--muted)}
  .card.imp1{border-left:6px solid var(--border)}
  .cardtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .cardtop .label{flex:1;min-width:180px}
  .impwrap{display:flex;gap:8px;align-items:center}
  .impwrap label{font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .gap{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--scarlet);color:var(--on-scarlet);padding:2px 8px;border-radius:2px}
  .meta{font-size:.84rem;color:var(--muted);margin-bottom:8px}
  .ev{margin:0 0 12px;display:grid;gap:6px}
  .ev blockquote{margin:0;padding:6px 12px;border-left:3px solid var(--border);font-size:.92rem;background:var(--band)}
  .ev mark{background:var(--mark);color:var(--mark-fg);padding:0 2px}
  .noev{font-size:.88rem;color:var(--muted);margin-bottom:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--bg);border:1px solid var(--scarlet);color:var(--link);padding:6px 12px;border-radius:999px;font-size:.88rem;font-weight:600;cursor:pointer}
  .chip:hover{background:var(--band)}
  details.pt{margin-top:30px;border:1px solid var(--border);padding:12px 16px;background:var(--surface)}
  details.pt summary{cursor:pointer;font-weight:700}
  .cardtop input[type=text]{font-weight:700}


  /* dashboard visuals */
  :root{ --st-build-bg:#F2D27A; --st-build-fg:#2A2100; --st-strong-bg:#2F7D32; --st-strong-fg:#FFFFFF; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --st-build-bg:#8A6A12; --st-build-fg:#FFF1C2; --st-strong-bg:#2E6B3C; --st-strong-fg:#FFFFFF; } }
  :root[data-theme="dark"]{ --st-build-bg:#8A6A12; --st-build-fg:#FFF1C2; --st-strong-bg:#2E6B3C; --st-strong-fg:#FFFFFF; }
  .chart .tx.sm{font-size:11px}
  .chart .tx.rl{font-size:15px;font-weight:600;fill:var(--fg)}
  @media(min-width:761px){.twocol.wide{grid-template-columns:1.2fr 1fr}}
  .chart .rg{fill:none;stroke:var(--border);stroke-width:1}
  .chart .ra{stroke:var(--border);stroke-width:1}
  .chart .pc{fill:var(--scarlet);fill-opacity:.22;stroke:var(--scarlet);stroke-width:2.5;stroke-linejoin:round}
  .chart .pcd{fill:var(--scarlet)}
  .chart .pd{fill:none;stroke:var(--fg);stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round}
  .legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:14px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{display:inline-block;width:14px;height:14px;border-radius:2px;border:1px solid var(--border)}
  .legend .sw.line-c{background:var(--scarlet);opacity:.5;border-color:var(--scarlet)}
  .legend .sw.line-d{background:transparent;border:2px dashed var(--fg);height:0;width:18px;border-radius:0}
  .gts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:6px}
  .gt{padding:8px 10px;border:1px solid var(--border);display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.86rem}
  .gt .gt-l{font-weight:700;line-height:1.25}
  .gt .gt-m{font-size:.76rem;opacity:.9}
  .st-gap{background:var(--scarlet);color:var(--on-scarlet);border-color:var(--scarlet)}
  .st-build{background:var(--st-build-bg);color:var(--st-build-fg);border-color:var(--st-build-bg)}
  .st-strong{background:var(--st-strong-bg);color:var(--st-strong-fg);border-color:var(--st-strong-bg)}
  .st-low{background:var(--band);color:var(--fg)}
  .st-unrated{background:transparent;color:var(--muted);border-style:dashed}
  .legend .sw.st-gap,.legend .sw.st-build,.legend .sw.st-strong,.legend .sw.st-low,.legend .sw.st-unrated{display:inline-block}

  /* keyword guide */
  .kwsearch{max-width:560px}
  .roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:6px}
  .role{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--scarlet);padding:16px;min-width:0}
  .role h3{font-size:1.08rem}
  .secbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .secbar span{font-size:.76rem;font-weight:600;background:var(--band);padding:2px 8px;border-radius:2px}
  ul.ex{margin:4px 0 0;padding-left:18px;font-size:.9rem}
  ul.ex li{margin-bottom:2px;overflow-wrap:anywhere}
  details.kwc{background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
  details.kwc summary{cursor:pointer;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
  details.kwc .kwl{font-weight:700}
  .kwb{padding:4px 16px 16px}
  .chips2{display:flex;gap:6px;flex-wrap:wrap}
  .syn{background:var(--band);border:1px solid var(--border);padding:3px 10px;border-radius:999px;font-size:.88rem}
  blockquote.exq{margin:0 0 6px;padding:8px 12px;border-left:3px solid var(--scarlet);background:var(--band);font-size:.95rem}

  footer.site{background:var(--foot);color:var(--foot-fg);padding-block:26px;font-size:.88rem}
  footer.site .inner{display:flex;justify-content:space-between;gap:12px 32px;flex-wrap:wrap;align-items:flex-start}
  footer.site b{font-family:var(--serif);font-size:1.05rem;color:#fff}
  footer.site p{max-width:60ch}
  .linkbtn{background:none;border:none;color:var(--foot-fg);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0;margin-right:16px}
  .saved{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;font-size:.88rem;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;border-radius:3px}
  .saved.show{opacity:1}
  @media (prefers-reduced-motion: reduce){.saved{transition:none}}
</style>

</head>
<body>
<header class="site">
  <div class="stripe"></div>
  <div class="inner headrow">
    <div class="ptitle"><span class="proj">One Health Career Toolkit</span><span class="sub">Student resources</span></div>
    <nav class="main" id="nav" aria-label="Main"></nav>
  </div>
</header>

<main id="main"></main>

<footer class="site">
  <div class="inner">
    <div>
      <b>One Health Career Toolkit</b>
      <p style="margin-top:6px">Built from a survey of One Health employers and an analysis of real job postings, to help students plan a path into the field.</p>
    </div>
    <div>
      <p>Design mockup for review. Not an official university page.</p>
      <p style="margin-top:8px"><button class="linkbtn" id="sampleBtn" type="button"></button><button class="linkbtn" id="clearBtn" type="button"></button></p>
    </div>
  </div>
</footer>
<div class="saved" id="saved" role="status">Saved</div>

<script>
(function(){
  var MAP_URL = 'https://maliceomatos-develop.github.io/one-health-orgs/';
  var DOMAINS = {A:"Foundational One Health Skills", B:"Analytical Skills", C:"Operational Skills", D:"Leadership and Strategy", E:"Interpersonal and Cross-cutting Skills"};
  var IMP = ['Not mentioned','Low','Medium','High'];

  // domain, label, description bullets (from the survey instrument), search terms for reading postings ("!" = whole word only)
  var COMP_DEF = [

    ["A","Human, animal, and environmental interactions",["Identify pathways through which environmental changes influence animal and human health outcomes"],["zoono","human-animal","animal-human","human, animal","animal health","environmental health","wildlife","vector-borne","spillover","climate"]],
    ["A","Ecosystem Health",["Recognize interrelationships among ecosystems, animal health, and human health","Analyze the effects of direct impacts on the environment"],["ecosystem","ecolog","habitat","wildlife health","ecohealth","environmental impact"]],
    ["A","Biodiversity and ecosystem services",["Evaluate how biodiversity loss contributes to the emergence of zoonotic diseases"],["biodiversity","ecosystem service","natural resource","conservation","protected area"]],
    ["A","Principles of Public Health",["Analyze factors of health that impact human, animal, and environmental communities","Engage communities in programs to improve One Health systems"],["public health","preventive medicine","population health","health promotion","community health","mph!"]],
    ["B","Integrative One Health surveillance",["Perform outbreak or exposure detection","Analyze data from surveillance"],["surveillance","early warning","reporting system","disease monitoring","sentinel"]],
    ["B","Social and integrative epidemiology",["Apply epidemiological thinking and a public health approach to a One Health-related issue or disease","Provide One Health policy recommendations based on epidemiological analysis"],["epidemiolog","social determinants","health equity","disparit"]],
    ["B","Quantitative methods in One Health",["Apply modeling techniques to analyze disease transmission across human, animal, and environmental systems"],["statistic","quantitative","data analysis","data analytics","biostatistic","regression","modeling","modelling","stata!","spss!","sas!","python!","gis!"]],
    ["B","Qualitative methods in One Health",["Conduct interviews or focus groups with stakeholders across human, animal, and environmental health sectors","Use thematic analysis to interpret community perspectives on One Health issues"],["qualitative","focus group","interview","ethnograph","mixed method","thematic analysis","needs assessment"]],
    ["B","Research",["Conduct research according to professional standards of data management, analysis, and application","Translate research findings to public health practice"],["research","publication","peer-review","manuscript","grant writing","scientific writing","study design","evidence-based","literature review","principal investigator"]],
    ["B","Risk assessment and mitigation",["Conduct One Health risk assessment and analysis","Implement One Health risk management and mitigation"],["risk assessment","risk analysis","risk management","risk communication","mitigation","biosecurity","biosafety","hazard"]],

      var line = raw.replace(/^[\s\u2022\u00b7\u25aa\u25cf\u25e6*\u2013\u2014-]+/,'').trim();
      if(!line) return;
      var words = line.split(/\s+/).length;
      var kwPref = /preferred|desired|desirable|nice to have|bonus|a plus|additional qualif/i.test(line);
      var kwReq = /required|minimum|basic qualif|qualifications|responsibilit|duties|what you|must have|essential|requirements/i.test(line);
      var isHeading = (kwPref || kwReq) && !/[.;]$/.test(line) && (words <= 5 || (/:$/.test(line) && words <= 8));
      if(isHeading){ mode = kwPref ? 'preferred' : 'required'; return; }

        s = s.trim(); if(s.length < 3) return;
        var w = mode==='required' ? 1.5 : (mode==='preferred' ? 0.5 : 1);
        if(/\b(preferred|desired|desirable|a plus|nice to have|bonus)\b/i.test(s)) w = 0.5;
        else if(/\b(required|must|essential|minimum|demonstrated|proven|strong|expert|proficien|excellent)\b/i.test(s)) w = Math.max(w,1.5);
        units.push({s:s, w:w});

  }

  }

          sc,
          h('div',{class:'scalecap'},h('span',{text:'Not confident'}),h('span',{text:'Very confident'})),
          h('div',{class:'f2'},
            field('How I can demonstrate it','core-'+c.id+'-demo', textarea('core-'+c.id+'-demo', row.demo, 'A project, course, or experience that shows this', function(v){ row.demo = v; })),
            field('How I can improve','core-'+c.id+'-imp', textarea('core-'+c.id+'-imp', row.imp, 'A concrete next step', function(v){ row.imp = v; }))
          )));
      });
      out.append(sec);
    });
    return out;
  }

  function personalHome(){
    var out = h('div');
    if(data.sheets.length){
      out.append(h('h2',{text:'Your postings',style:'margin-bottom:14px'}));
      out.append(h('div',{class:'sheetlist'}, data.sheets.map(function(s){
        var hi = COMPS.filter(function(c){ return effImp(s.rows[c.id]||{})===3; }).length;
        return h('div',{class:'sheetcard'}, h('h3',{text:s.title}), h('p',{class:'small',text:dayLabel(dayKey(s.created))+' \u00b7 '+hi+' high-importance skills'}),
          h('div',null,h('button',{class:'btn ghost sm',type:'button',text:'Open',onclick:function(){ sheetId = s.id; render(); window.scrollTo(0,0); }})));
      })));
    }
    var title = h('input',{type:'text',id:'np-title',placeholder:'e.g., Program Coordinator, State Health Department'});
    var url = h('input',{type:'url',id:'np-url',placeholder:'https://\u2026 (optional)'});
    var text = h('textarea',{id:'np-text',class:'big',placeholder:'Paste the full job description here'});
    var err = h('p',{class:'err',hidden:true});
    var go1 = h('button',{class:'btn',type:'button',text:'Analyze posting',onclick:function(){
      var t = text.value.trim();
      if(t.length<60){ err.hidden=false; err.textContent='Paste the full job description (at least a few sentences) so the matrix has something to read.'; return; }
      var s = newSheet(title.value.trim(), url.value.trim(), t); data.sheets.unshift(s); save(); sheetId = s.id; render(); window.scrollTo(0,0);
    }});
    out.append(h('div',{class:'panel'},
      h('h2',{text:data.sheets.length?'Analyze another posting':'Analyze a job posting',style:'font-size:1.2rem;margin-bottom:6px'}),
      h('p',{class:'hint',text:'The matrix reads the text and suggests how important each core competency is for this job, using the words and sections of the posting. You can change every suggestion.'}),
      h('div',{class:'formgrid'},
        h('div',{class:'formgrid two'}, field('Job title','np-title',title), field('Link to the posting','np-url',url)),
        field('Job description','np-text',text),
        h('div',null, go1, err))));
    return out;
  }

  function sheetBody(s){
    var wrap = h('div');
    var delBtn = armed(h('button',{class:'textbtn',type:'button'}), 'Delete this posting', 'Click again to delete', function(){
      data.sheets = data.sheets.filter(function(x){ return x.id!==s.id; }); save(); sheetId = null; render();
    });
    wrap.append(h('div',{class:'sheetbar'},
      h('button',{class:'btn ghost sm',type:'button',text:'\u2190 All postings',onclick:function(){ sheetId = null; render(); window.scrollTo(0,0); }}), delBtn));

    var title = h('input',{type:'text',id:s.id+'-title'}); title.value = s.title;
    var url = h('input',{type:'url',id:s.id+'-url',placeholder:'https://\u2026'}); url.value = s.url||'';
    var t1, t2;
    title.addEventListener('input', function(){ s.title = title.value; clearTimeout(t1); t1 = setTimeout(save,500); });
    url.addEventListener('input', function(){ s.url = url.value; clearTimeout(t2); t2 = setTimeout(save,500); });
    var linkRow = h('div',{class:'formgrid two'}, field('Job title', s.id+'-title', title), field('Link to the posting', s.id+'-url', url));
    wrap.append(linkRow);
    if(s.url) wrap.append(h('p',{style:'margin-top:6px'},h('a',{href:s.url,target:'_blank',rel:'noopener noreferrer',class:'textbtn',text:'Open posting \u2197'})));

    var strip = h('div',{class:'strip',id:'strip'});
    wrap.append(strip);
    function refreshStrip(){
      var n = [0,0,0,0], gaps = 0;
      COMPS.forEach(function(c){ var r = s.rows[c.id]; var e = effImp(r); n[e]++; if(e>=2 && r.conf && r.conf<=2) gaps++; });
      s.custom.forEach(function(r){ n[r.imp||0]++; if((r.imp||0)>=2 && r.conf && r.conf<=2) gaps++; });
      strip.innerHTML = '';
      [3,2,1,0].forEach(function(i){ strip.append(h('span',null,IMP[i]+': ',h('b',{text:String(n[i])}))); });
      strip.append(h('span',null,'Priority gaps: ',h('b',{text:String(gaps)})));
    }
    refreshStrip();

    wrap.append(h('div',{class:'row',style:'margin:14px 0 4px'}, h('span',{class:'small',text:'Sort by'}),
      h('div',{class:'seg',style:'margin:0'},
        h('button',{type:'button',text:'Importance','aria-pressed':String(sortMode==='importance'),onclick:function(){ sortMode='importance'; render(); }}),
        h('button',{type:'button',text:'Area','aria-pressed':String(sortMode==='area'),onclick:function(){ sortMode='area'; render(); }}))));

    function card(c){ return sheetCard(s, c, refreshStrip); }
    if(sortMode==='importance'){
      [3,2,1,0].forEach(function(level){
        var items = COMPS.filter(function(c){ return effImp(s.rows[c.id])===level; });
        if(!items.length) return;
        wrap.append(h('div',{class:'group'}, IMP[level]+(level===0?' in this posting':' importance'), h('small',{text:items.length+' competenc'+(items.length===1?'y':'ies')})));
        items.forEach(function(c){ wrap.append(card(c)); });
      });
    } else {
      Object.keys(DOMAINS).forEach(function(d){
        var sec = h('div',{class:'domain'}, h('h2',{text:d+'. '+DOMAINS[d]}));
        COMPS.filter(function(c){ return c.domain===d; }).forEach(function(c){ sec.append(card(c)); });
        wrap.append(sec);
      });
    }

    // other competencies
    var other = h('div',{class:'domain'}, h('h2',{text:'Other competencies for this job'}));
    other.append(h('p',{class:'hint',text:'Add anything this posting asks for that is not among the 23 core competencies.'}));
    var chipWrap = h('div',{class:'chips',style:'margin-bottom:16px'});
    (s.extras||[]).filter(function(x){ return !s.custom.some(function(r){ return r.label===x.label; }); }).forEach(function(x){
      chipWrap.append(h('button',{class:'chip',type:'button',text:'+ '+x.label,title:'Found in the posting',onclick:function(){
        s.custom.push({label:x.label, imp:x.level, evidence:x.ev[0]||'', conf:0, demo:'', improve:''}); save(); render();
      }}));
    });
    if(chipWrap.children.length){ other.append(h('div',{class:'cap',text:'Found in this posting'}), chipWrap); }
    s.custom.forEach(function(r, idx){ other.append(customCard(s, r, idx, refreshStrip)); });
    other.append(h('button',{class:'btn ghost',type:'button',text:'+ Add a competency',onclick:function(){
      s.custom.push({label:'', imp:2, evidence:'', conf:0, demo:'', improve:''}); save(); render();
    }}));
    wrap.append(other);

    // posting text
    var pt = textarea(s.id+'-text', s.text, '', function(v){ s.text = v; }, 'big');
    wrap.append(h('details',{class:'pt'}, h('summary',{text:'Posting text'}),
      h('div',{style:'margin-top:12px'}, pt),
      h('div',{style:'margin-top:10px'}, h('button',{class:'btn ghost sm',type:'button',text:'Re-analyze',onclick:function(){ s.text = pt.value; analyzeInto(s); save(); render(); }}),
        h('span',{class:'small',style:'margin-left:12px',text:'Updates the suggestions. Importance levels you changed by hand are kept.'}))));
    return wrap;
  }

  function impSelect(id, value, onChange, skipZero){
    var sel = h('select',{id:id});
    IMP.forEach(function(l,i){ if(skipZero && i===0) return; var o = h('option',{value:String(i),text:l}); if(i===value) o.selected = true; sel.append(o); });
    sel.addEventListener('change', function(){ onChange(parseInt(sel.value,10)); });
    return sel;
  }

  function sheetCard(s, c, refreshStrip){
    var r = s.rows[c.id];
    var card = h('div',{class:'card imp'+effImp(r)});
    var gap = h('span',{class:'gap',text:'Priority gap'});
    var sug = h('span',{class:'small'});
    function refresh(){
      var e = effImp(r);
      card.className = 'card imp'+e;
      gap.hidden = !(e>=2 && r.conf && r.conf<=2);
      sug.textContent = (r.ovr!=null && r.ovr!==r.auto) ? 'Suggested from posting: '+IMP[r.auto] : '';
    }
    var sel = impSelect(s.id+'-'+c.id+'-imp', effImp(r), function(v){ r.ovr = v; refresh(); refreshStrip(); save(); });
    card.append(h('div',{class:'cardtop'}, h('div',{class:'label',text:c.label}), gap, h('div',{class:'impwrap'}, h('label',{for:s.id+'-'+c.id+'-imp',text:'Importance'}), sel)));
    var cc = coreConf(c.id);
    card.append(h('div',{class:'meta'}, 'Core matrix rating: '+(cc? cc+'/5' : 'not rated yet')+' ', sug));
    if(r.ev && r.ev.length){
      card.append(h('div',{class:'cap',text:'From the posting'}));
      card.append(h('div',{class:'ev'}, r.ev.map(function(t){ var b = h('blockquote'); highlight(b, t, c.terms); return b; })));
    } else card.append(h('div',{class:'noev',text:'Not found in the posting text.'}));
    card.append(h('div',{class:'fl',text:'My confidence for this job'}));
    card.append(scale(s.id+'-'+c.id+'-conf', r.conf||0, function(v){ r.conf = v; refresh(); refreshStrip(); save(); }, 'Confidence in '+c.label+' for this job'));
    card.append(h('div',{class:'f2'},
      field('How I can demonstrate it', s.id+'-'+c.id+'-demo', textarea(s.id+'-'+c.id+'-demo', r.demo, 'Evidence that matches what this posting asks for', function(v){ r.demo = v; })),
      field('How I can improve', s.id+'-'+c.id+'-imp2', textarea(s.id+'-'+c.id+'-imp2', r.imp, 'A concrete next step', function(v){ r.imp = v; }))));
    refresh();
    return card;
  }

  function customCard(s, r, idx, refreshStrip){
    var key = s.id+'-x'+idx;
    var card = h('div',{class:'card imp'+(r.imp||0)});
    var gap = h('span',{class:'gap',text:'Priority gap'});
    function refresh(){ card.className = 'card imp'+(r.imp||0); gap.hidden = !((r.imp||0)>=2 && r.conf && r.conf<=2); }
    var name = h('input',{type:'text',id:key+'-name',placeholder:'Name this competency','aria-label':'Competency name'}); name.value = r.label||'';
    var tn; name.addEventListener('input', function(){ r.label = name.value; clearTimeout(tn); tn = setTimeout(save,500); });
    var sel = impSelect(key+'-imp', r.imp||0, function(v){ r.imp = v; refresh(); refreshStrip(); save(); });
    card.append(h('div',{class:'cardtop'}, h('div',{class:'label'}, name), gap, h('div',{class:'impwrap'}, h('label',{for:key+'-imp',text:'Importance'}), sel),
      h('button',{class:'textbtn',type:'button',text:'Remove',onclick:function(){ s.custom.splice(idx,1); save(); render(); }})));
    card.append(field('What the posting says', key+'-ev', textarea(key+'-ev', r.evidence, 'Quote or paraphrase the relevant line', function(v){ r.evidence = v; })));
    card.append(h('div',{class:'fl',style:'margin-top:12px',text:'My confidence for this job'}));
    card.append(scale(key+'-conf', r.conf||0, function(v){ r.conf = v; refresh(); refreshStrip(); save(); }, 'Confidence in this competency'));
    card.append(h('div',{class:'f2'},
      field('How I can demonstrate it', key+'-demo', textarea(key+'-demo', r.demo, 'Evidence you could show', function(v){ r.demo = v; })),
      field('How I can improve', key+'-improve', textarea(key+'-improve', r.improve, 'A concrete next step', function(v){ r.improve = v; }))));
    refresh();
    return card;
  }

  function render(){
    renderNav();
    var main = document.getElementById('main'); main.innerHTML = '';
    main.append(view==='matrix' ? matrixView() : view==='dash' ? dashView() : view==='kw' ? kwView() : homeView());
    var sb = document.getElementById('sampleBtn'); sb.replaceWith(sb.cloneNode(false));
    sb = document.getElementById('sampleBtn');
    if(hasData()) armed(sb, 'Load sample data', 'Replaces your data. Click again', function(){ loadSample(); render(); });
    else { sb.textContent = 'Load sample data'; sb.addEventListener('click', function(){ loadSample(); render(); }); }
  }

  armed(document.getElementById('clearBtn'), 'Clear my saved data', 'Click again to clear everything', function(){
    data = {core:{rows:{}, history:[]}, sheets:[], sample:false}; persist(); sheetId = null; render();
  });

  render();
})();
</script>

</body>
</html>
